  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout do código
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Setup do Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 3. Build da imagem Docker (sem push)
      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          load: true
          tags: dns-server:latest
    

      # 4. Exporta a imagem Docker para um arquivo .tar
      - name: Save Docker image to tar file
        run: |
          docker save dns-server:latest > dns-server.tar

      # 5. Faz upload da imagem como artefato do GitHub Actions
      - name: Upload Docker image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dns-server-image
          path: dns-server.tar
  

