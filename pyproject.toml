[project]
name = "dns"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiodns>=3.6.1",
    "aiosqlite>=0.22.1",
    "dnslib>=0.9.26",
    "dnspython>=2.8.0",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "ruff>=0.14.10",
    "sqlalchemy[asyncio]>=2.0.45",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    # "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    # "C4",  # flake8-comprehensions
    # "UP",  # pyupgrade
]
ignore = [
    # "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402", "I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

